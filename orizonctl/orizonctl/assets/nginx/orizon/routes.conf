# Everything the app serves, shared by every template. Included inside a server
# block that has set $orizon_frontend and $orizon_backend.
#
# The backend enforces no authorization of its own (docs/SECURITY_NOTES.md), so
# only the surfaces it exempts from X-Internal-Api-Key go to it directly: the
# public APIs (/v1, /public, API keys checked per route), provider webhooks
# (/webhooks), the dev OAuth helpers (/dev/auth) and the connector OAuth
# callback (/mcp/auth/callback, which must work even when the provider's
# redirect arrives without a session cookie). Everything else, including every
# /api/* route, goes to Next.js, which checks the session and adds the internal
# key itself.

# Uploads: matches the ORIZON_LIBRARY_MAX_UPLOAD_SIZE_MB default and is streamed
# straight through rather than spooled to the container's disk first.
client_max_body_size    10240m;
proxy_request_buffering off;

# Chat and the public API stream tokens (SSE); agent runs and large ingests can
# go quiet for a long time between bytes.
proxy_buffering       off;
proxy_cache           off;
proxy_http_version    1.1;
proxy_connect_timeout 30s;
proxy_read_timeout    3600s;
proxy_send_timeout    3600s;
send_timeout          3600s;

proxy_set_header Host              $orizon_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $orizon_forwarded_proto;
proxy_set_header X-Forwarded-Host  $orizon_host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

add_header X-Content-Type-Options nosniff    always;
add_header X-Frame-Options        SAMEORIGIN always;

location = /nginx-health {
    access_log   off;
    default_type text/plain;
    return 200 "ok\n";
}

location ~ ^/(v1|public|webhooks|dev/auth)(/|$) {
    proxy_pass $orizon_backend;
}

location = /mcp/auth/callback {
    proxy_pass $orizon_backend;
}

location / {
    proxy_pass $orizon_frontend;
}
