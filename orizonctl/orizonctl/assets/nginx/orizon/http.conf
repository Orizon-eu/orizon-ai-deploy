# http-level pieces shared by every OrizonAI template. Included once, above the
# server blocks.

server_tokens off;

# The Host exactly as the browser sent it, port included: on a non-default port
# ($host drops it) Next.js would see its Server Action Origin check fail.
map $http_host $orizon_host {
    default $http_host;
    ''      $host;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# The scheme the browser actually used. A WAF or company proxy that terminated
# TLS in front of us says so in X-Forwarded-Proto; without one it is our own.
# Only an upgrade to https is honoured, so a client cannot talk us down.
map $http_x_forwarded_proto $orizon_forwarded_proto {
    default $scheme;
    https   https;
}

# Port 80 on the HTTPS templates: redirect browsers, but serve a proxy that
# already did TLS (no redirect loop) and keep the health probe on plain HTTP.
map "$orizon_forwarded_proto:$uri" $orizon_redirect_to_https {
    default               0;
    "http:/nginx-health"  0;
    "~^http:"             1;
}
