  # ---------------------------------------------------------------------------
  # Code sandbox — Python execution for the chat model
  #
  # Three services, and the split between them IS the security boundary:
  #
  #   sandbox-dind     the Docker daemon that runs untrusted code. Rootless, and
  #                    deliberately NOT the host daemon.
  #   sandbox-image-loader  one-shot; pre-pulls the runtime image into that
  #                    daemon's private image store at boot.
  #   mcp-sandbox      the MCP control plane the backend talks to.
  #
  # Why a separate daemon at all: llm-sandbox creates containers by talking to a
  # Docker socket. Mounting the *host* socket into a service that executes
  # model-authored code would hand that code root-equivalent control of the host
  # — every container, volume and image on the box, including the database. The
  # backend already enforces no auth of its own (docs/SECURITY_NOTES.md §1), so
  # anything reaching it would inherit that. A dedicated rootless daemon means an
  # escape lands in a user-namespaced sidecar holding nothing of value.
  # ---------------------------------------------------------------------------
  sandbox-dind:
    # -rootless is load-bearing, not a preference. Untrusted code runs as root
    # *inside* its container (llm-sandbox copies the snippet in as a root-owned
    # 0600 file, so a non-root container user cannot read it). Under a rootless
    # daemon that container-root maps through a user namespace to an
    # unprivileged host uid. Switching this to plain `docker:27-dind` silently
    # turns container-root into host-root and voids the whole design.
    image: docker:27-dind-rootless
    container_name: orizon-sandbox-dind
    # Required even for the rootless variant: the daemon needs to set up its own
    # user namespaces and mounts. The privilege stays with this sidecar, which
    # holds no project data — not with the backend.
    privileged: true
    #
    # UBUNTU 23.10+ HOSTS NEED ONE HOST-SIDE STEP, or this container restart-loops
    # on "[rootlesskit:parent] error: failed to start the child: fork/exec
    # /proc/self/exe: operation not permitted".
    #
    # Those releases set kernel.apparmor_restrict_unprivileged_userns=1, which
    # transitions anything asking for an unprivileged user namespace into a profile
    # that denies CAP_SYS_ADMIN — the capability RootlessKit needs to create the
    # namespace in the first place. The host kernel decides that from the binary's
    # path, so `privileged: true` does not exempt it and neither does any
    # `security_opt:` here; all three were tried and fail identically. Install the
    # profile in apparmor/rootlesskit, which grants that one binary that one
    # permission and leaves the restriction in force for the rest of the machine:
    #
    #   sudo cp apparmor/rootlesskit /etc/apparmor.d/rootlesskit
    #   sudo apparmor_parser -r /etc/apparmor.d/rootlesskit
    #
    # Switching to rootful `docker:27-dind` also makes the error go away and is the
    # wrong fix: see the note below on what that costs.
    #
    # KNOWN LIMITATION — cgroup limits are silently dropped here.
    # A rootless daemon only gets cgroup control when systemd delegates it. In
    # this container it does not, so `docker info` reports "Cgroup Driver: none"
    # and per-container --memory / --pids-limit are ACCEPTED AND IGNORED. Verified
    # by starting a container through this sidecar with --memory=64m
    # --pids-limit=32: memory.max and pids.max both read "max".
    #
    # This is why sandbox.py enforces memory, CPU-time, process count and file
    # size with rlimits (data/cpu/nproc/fsize) instead, which the kernel applies
    # per-process with no cgroup involvement, and which code running as a
    # non-root uid cannot raise. Check the mode on a given host with:
    #   docker compose -f docker-compose.mcp.yml exec sandbox-dind \
    #     docker -H tcp://localhost:2375 info | grep -i cgroup
    #
    # If you would rather have cgroup enforcement than user-namespace isolation,
    # switch the image above to `docker:27-dind` (rootful). That makes the
    # per-container memory/pids limits real, but it also makes container-root
    # equal to host-root through this privileged sidecar. The rootless default
    # trades DoS resistance (bounded by the 4G cap below) for escape resistance,
    # which is the more severe of the two failure modes.
    environment:
      # Plaintext TCP is acceptable because 2375 is never published to the host
      # and orizon-sandbox-network carries only this daemon and mcp-sandbox.
      # Anything that can reach this port can create containers on this daemon,
      # so do not add a `ports:` mapping here and do not attach other services.
      DOCKER_TLS_CERTDIR: ""
    command:
      - "--host=tcp://0.0.0.0:2375"
      # Cap what the daemon will ever hand out, independent of what the MCP
      # server asks for, so a bug there cannot exhaust the host. These are
      # rlimits rather than cgroup limits on purpose — see the note below.
      - "--default-ulimit=nproc=256:256"
      - "--default-ulimit=nofile=1024:1024"
      - "--default-ulimit=fsize=268435456:268435456"
    volumes:
      # Rootless dind stores images/layers under the rootless user's home, not
      # /var/lib/docker. A named volume keeps the pulled runtime image across
      # restarts so the loader below is a no-op after first boot.
      - orizon_sandbox_dind:/home/rootless/.local/share/docker
    networks:
      - orizon-sandbox-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://localhost:2375", "info"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: 40s
      retries: ${HEALTHCHECK_RETRIES:-5}
    deploy:
      resources:
        limits:
          # This cap IS enforced — it is applied by the *host* daemon, which has
          # cgroups, unlike the nested limits described above. It is the hard
          # ceiling on total sandbox damage: the worst case is that sandboxed
          # work OOMs this sidecar, which then restarts.
          # Must exceed the memory cap times the concurrency cap (both under
          # Connectors > Code sandbox) plus daemon overhead, or ordinary concurrent
          # executions will trip it. Those two are editable and this is not, so the
          # panel says on both of them what they have to stay under.
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.25"

  sandbox-image-loader:
    # The dind daemon has its own image store — the host's images are invisible
    # to it. Without this, the first run_python call triggers an implicit ~1GB
    # pull inside the request and appears to the user as a hang, then a timeout.
    #
    # This service owns the runtime image end to end: it pulls it when the tag is
    # publishable, and otherwise builds it directly inside the sandbox daemon.
    # Editing SANDBOX_PACKAGES or the Dockerfile and running `docker compose -f
    # docker-compose.mcp.yml up -d` is therefore the entire procedure for adding a
    # library or a font. Nothing has to be built on the host and nothing has to be
    # side-loaded, which is what made the old flow drift: SANDBOX_IMAGE is
    # `:local` by default, so its `docker pull` could never succeed, and the
    # "already present" branch then kept a stale image forever while the panel
    # allowlist advertised packages that image did not hold.
    #
    # It re-runs on every `up -d` and costs nothing when nothing changed: it
    # compares two labels and exits. SANDBOX_IMAGE_REBUILD=true, passed here or
    # through `run --rm -e`, rebuilds from scratch instead.
    #
    # Both names come from .env.mcp through env_file below, NOT through ${...}:
    # compose interpolation resolves only against the root .env, so they would
    # come back empty here. That is also why this builds rather than letting
    # compose do it — a build.args entry would need the interpolation that does
    # not work for this file.
    image: docker:27-cli
    container_name: orizon-sandbox-image-loader
    depends_on:
      sandbox-dind:
        condition: service_healthy
    env_file:
      - .env.mcp
    environment:
      DOCKER_HOST: tcp://sandbox-dind:2375
    volumes:
      # The script, and the build context it hands the daemon: the Dockerfile
      # alone, so the upload is a few KB.
      #
      # The helper package generated scripts imported, and the API digest of the
      # document libraries, are both gone with the code generation. Documents are
      # rendered in the backend now and no document job reaches this container.
      - ./mcp-servers/ensure-sandbox-image.sh:/ensure-sandbox-image.sh:ro
      - ./mcp-servers/Dockerfile.sandbox-runtime:/build/Dockerfile:ro
    entrypoint: ["sh", "/ensure-sandbox-image.sh"]
    networks:
      - orizon-sandbox-network
    restart: "no"

  mcp-sandbox:
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-mcp-sandbox:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: mcp-servers/Dockerfile.sandbox
    container_name: orizon-mcp-sandbox
    env_file:
      - .env.mcp
    environment:
      MCP_PORT: "${MCP_SANDBOX_PORT:-8107}"
      # auth="none" connector — brokers a local daemon, not a per-user API, so
      # there is no Bearer token to forward. The backend still sends this
      # container's execution policy per request as X-Mcp-* headers, which is why
      # run_mcp_http.py reads those headers whether or not a token is expected.
      MCP_CRED_VARS: ""
      # Points at the sidecar. Never set this to the host socket.
      DOCKER_HOST: tcp://sandbox-dind:2375
    # No volumes. This container used to mount the doc-assets volume read-only,
    # so a document job could hand `run_python` a path to its logo and to the
    # file being edited. Documents are rendered in the backend and nothing is
    # placed in a sandbox container any more: a snippet reads only itself.
    ports:
      - "${MCP_SANDBOX_PORT:-8107}:${MCP_SANDBOX_PORT:-8107}"
    depends_on:
      sandbox-dind:
        condition: service_healthy
    networks:
      # Two networks by design: orizon-network so the backend can call it,
      # orizon-sandbox-network to reach the daemon. sandbox-dind is NOT on
      # orizon-network, so sandboxed code — even with runtime installs enabled
      # and a network — has no route to the database or the backend.
      - orizon-network
      - orizon-sandbox-network
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import socket,os; socket.create_connection(('localhost', int(os.environ.get('MCP_PORT',8107))), timeout=5).close()"
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: 15s
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

  # ── Template: copy-paste this block to add the next MCP server ───────
  #
  # mcp-<slug>:
  #   image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-mcp-<slug>:${ORIZON_VERSION:-v1.0.0}
  #   build:
  #     context: .
  #     dockerfile: mcp-servers/Dockerfile.<slug>
  #   container_name: orizon-mcp-<slug>
  #   env_file:
  #     - .env.mcp
  #   environment:
  #     MCP_PORT: "<NEXT_PORT>"         # 8101, 8102, …
  #     MCP_CRED_VARS: ""               # e.g. "ACCESS_TOKEN" if auth needed
  #   networks:
  #     - orizon-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test:
  #       - "CMD"
  #       - "python3"
  #       - "-c"
  #       - "import socket; socket.create_connection(('localhost', <NEXT_PORT>), timeout=5).close()"
  #     interval: ${HEALTHCHECK_INTERVAL:-30s}
  #     timeout: ${HEALTHCHECK_TIMEOUT:-10s}
  #     start_period: 15s
  #     retries: ${HEALTHCHECK_RETRIES:-3}

networks:
  orizon-network:
    external: true
    name: orizon-network

  # Carries only sandbox-dind and mcp-sandbox. Its purpose is to keep the
  # sandbox daemon OFF orizon-network: containers it spawns therefore have no
  # route to the database, the backend or the other MCP servers.
  #
  # Not marked `internal: true` on purpose — sandbox-image-loader has to pull the
  # ~1GB runtime image from the registry at first boot, and runtime installs
  # (SANDBOX_ALLOW_RUNTIME_INSTALL=true) need to reach an index. The residual
  # exposure is narrow: with the default SANDBOX_ALLOW_RUNTIME_INSTALL=false,
  # executed code gets network_mode=none and has no connectivity of any kind.
  # If you want egress closed off completely, set internal: true and side-load
  # the image instead:
  #   docker save "$SANDBOX_IMAGE" | docker -H tcp://sandbox-dind:2375 load
  orizon-sandbox-network:
    driver: bridge

volumes:
  # Image store for the rootless sandbox daemon. Persisting it means the runtime
  # image is pulled once rather than on every restart.
  orizon_sandbox_dind:
