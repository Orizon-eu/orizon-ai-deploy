      dockerfile: mcp-servers/Dockerfile.freshdesk
    container_name: orizon-mcp-freshdesk
    env_file:
      - .env.mcp
    environment:
      MCP_PORT: "${MCP_FRESHDESK_PORT:-8101}"
      # Forward Authorization: Bearer <api_key> → API_KEY env var per request
      MCP_CRED_VARS: "API_KEY"
      # No COMPANY_DOMAIN here. The backend sends it per request as an
      # X-Mcp-COMPANY_DOMAIN header, from Settings > System > Connectors, so an
      # admin can change which Freshdesk this talks to without recreating this
      # container. A value here would only be read when the server runs standalone.
    ports:
      - "${MCP_FRESHDESK_PORT:-8101}:${MCP_FRESHDESK_PORT:-8101}"
    networks:
      - orizon-network
    restart: unless-stopped
    healthcheck:
