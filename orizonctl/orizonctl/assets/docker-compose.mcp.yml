# ---------------------------------------------------------------------------
# MCP Servers — separate compose file
#
# The main docker-compose.yml owns the orizon-network. Bring it up first,
# then this file joins that network as an external reference.
#
# Usage:
#   docker compose up -d                              # creates the network
#   docker compose -f docker-compose.mcp.yml up -d    # joins it
#
# All MCP containers reach the backend over orizon-network at
# http://mcp-<slug>:<port>/mcp. They are exposed to the host for local
# development but never proxied through nginx.
#
# Each container reads .env.mcp and not .env: the ports, the host allowlist,
# the per-connector timeouts and the sandbox runtime image, and none of the stack
# configuration. Which tenant and which OAuth application a connector uses are
# panel settings, sent per request as X-Mcp-* headers.
#
# Two names in .env.mcp reach their containers through `env_file` rather than a
# `${...}` interpolation, and the difference matters when editing this file:
# interpolation resolves only against the root .env, so SANDBOX_IMAGE and
# SANDBOX_PACKAGES must not be written as `${SANDBOX_IMAGE}` anywhere here. An
# `environment:` line would also override `env_file`, silently substituting the
# interpolation fallback for the value the operator set.
#
# ── The code sandbox (mcp-sandbox) ───────────────────────────────────
# Unlike the API connectors, mcp-sandbox needs a second image: the runtime image
# that untrusted snippets execute in. It needs no separate step. The
# sandbox-image-loader service pulls it when SANDBOX_IMAGE is a registry tag and
# otherwise builds it inside the sandbox daemon, from the SANDBOX_PACKAGES it
# reads out of .env.mcp, and rebuilds it whenever either that list or
# Dockerfile.sandbox-runtime changes. Adding a library, or a font, is one edit
# followed by `up -d`. The first build takes a few minutes and produces ~1GB.
#
# To rebuild when neither input changed but the image is still wrong:
#   docker compose -f docker-compose.mcp.yml run --rm \
#     -e SANDBOX_IMAGE_REBUILD=true sandbox-image-loader
#
# To publish it instead, so deployments pull a fixed tag:
#   set -a; . ./.env.mcp; set +a
#   docker build -f mcp-servers/Dockerfile.sandbox-runtime \
#     --build-arg SANDBOX_PACKAGES="$SANDBOX_PACKAGES" \
#     --build-arg SANDBOX_RECIPE="$(sha256sum mcp-servers/Dockerfile.sandbox-runtime | cut -c1-16)" \
#     -t "$SANDBOX_IMAGE" .
#   docker push "$SANDBOX_IMAGE"
# Bump SANDBOX_IMAGE in .env.mcp when either input changes, or the loader warns
# that the pulled image and what this checkout describes disagree.
#
# ── Adding a new MCP server ──────────────────────────────────────────
# 1. Write a FastMCP server (or drop in a submodule) under mcp-servers/
# 2. Create mcp-servers/Dockerfile.<slug>  (copy Dockerfile.hubspot)
# 3. Copy the mcp-hubspot service block below, change:
#      - service name, image, container_name
#      - MCP_PORT (use next available: 8111, 8112, …; a customer-specific
#        server attached as external takes the next from 8300: 8300 is okasa)
#      - MCP_CRED_VARS="" if the server needs no credentials
# 4. Add an HTTP entry to app/config/mcp_servers.json:
#      "transport": "http",  "url": "http://mcp-<slug>:<port>/mcp"
# 5. docker compose -f docker-compose.mcp.yml up -d --build mcp-<slug>
#
# ── Removing an MCP server ───────────────────────────────────────────
# 1. Remove or comment out the service block below
# 2. Remove its entry from app/config/mcp_servers.json
# 3. docker compose -f docker-compose.mcp.yml up -d
#
# ── Customer-specific servers (profiles) ─────────────────────────────
# mcp-okasa is not a built-in connector: it has no manifest entry and is
# attached from Settings > External MCP on the one deployment that uses it, at
# http://mcp-okasa:8300/mcp. It runs only under its own profile or the shared
# `external` one, so every other deployment never pulls or starts it. On that
# server add one of them to COMPOSE_PROFILES in the root .env, e.g.
#   COMPOSE_PROFILES=transcription,okasa
# then `docker compose -f docker-compose.mcp.yml up -d mcp-okasa`. To stop it,
# remove the profile and run `docker compose -f docker-compose.mcp.yml rm -sf
# mcp-okasa`. It publishes no host port and reads no .env.mcp: it is reached
# only by the backend, and its allowlist is its own, so the shared one in
# .env.mcp never has to name it.
# ---------------------------------------------------------------------------

services:
  mcp-hubspot:
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-mcp-hubspot:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: mcp-servers/Dockerfile.hubspot
    container_name: orizon-mcp-hubspot
    env_file:
      - .env.mcp
    environment:
      # MCP_HUBSPOT_PORT comes from .env.mcp; Dockerfile falls back to 8100
      MCP_PORT: "${MCP_HUBSPOT_PORT:-8100}"
      # Forward Authorization: Bearer <token> → ACCESS_TOKEN env var per request
      MCP_CRED_VARS: "ACCESS_TOKEN"
      # MCP_CLIENT_ATTR no longer used (contextvars replaced os.environ injection)
      MCP_CLIENT_ATTR: "_client"
    ports:
      - "${MCP_HUBSPOT_PORT:-8100}:${MCP_HUBSPOT_PORT:-8100}"
    networks:
      - orizon-network
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import socket,os; socket.create_connection(('localhost', int(os.environ.get('MCP_PORT',8100))), timeout=5).close()"
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: 15s
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"

  mcp-freshdesk:
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-mcp-freshdesk:${ORIZON_VERSION:-v1.0.0}
