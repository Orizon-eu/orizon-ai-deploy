# Images are pulled from ${ORIZON_IMAGE_PREFIX}/<name>:${ORIZON_VERSION}. The
# prefix is the registry host plus project path. Default scr.syneto.eu/orizon-ai/orizon-ai:
# the Syneto Harbor proxy cache (project orizon-ai) in front of harbor.syneto.eu/orizon-ai,
# where build-images.sh pushes. Both are set in .env. Private registries need a
# `docker login` first, which orizonctl performs during configuration.
#
# Developers: `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
# adds the source-tree mounts (live Prisma schema) that a production host must
# not have.
#
# Healthcheck defaults (override via .env: HEALTHCHECK_INTERVAL, HEALTHCHECK_TIMEOUT, HEALTHCHECK_START_PERIOD, HEALTHCHECK_RETRIES)
# Defaults: interval=30s, timeout=30s, start_period=5s, retries=3

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  db:
    logging: *default-logging
    image: postgres:15-alpine
    container_name: orizon-db
    # Tuned for large bulk indexing (300k+ dirs). Defaults (max_wal_size=1GB)
    # cause back-to-back WAL checkpoints that saturate disk during indexing.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_timeout=30min"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_compression=on"
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - orizon_postgres_data:/var/lib/postgresql/data
    networks:
      - orizon-network
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-orizon}"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: "1.0"
        reservations:
          memory: 5G
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # LLM / VLLM servers
  # ---------------------------------------------------------------------------
  vllm-server:
    logging: *default-logging
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-ai-vllm:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: ./backend-orizon-ai/Dockerfile.vllm.text
    container_name: orizon-vllm
    ports:
      - "${VLLM_PORT:-8001}:${VLLM_PORT:-8001}"
    env_file:
      - .env.vllm
    environment:
      - VLLM_PORT=${VLLM_PORT:-8001}
    volumes:
      - ${LLM_MODELS_PATH:-${MODELS_PATH:-/srv/orizon-models}}:${LLM_MODELS_SERVE_PATH:-${MODELS_SERVE_PATH:-/home/vllm/models}}:ro
      - orizon_vllm_cache:/home/vllm/.cache
    networks:
      - orizon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT:-8001}/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: 300s
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 32G
        reservations:
          memory: 16G
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU_DEVICE:-0}"]
              capabilities: [gpu]

  # image-vllm-server:
  #   image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-ai-image-vllm:${ORIZON_VERSION:-v1.0.0}
  #   build:
  #     context: .
  #     dockerfile: ./backend-orizon-ai/Dockerfile.vllm.image
  #   container_name: orizon-image-vllm
  #   ports:
  #     - "${IMAGE_VLLM_PORT:-8003}:${IMAGE_VLLM_PORT:-8003}"
  #   env_file:
  #     - .env.vllm
  #   environment:
  #     - IMAGE_VLLM_PORT=${IMAGE_VLLM_PORT:-8003}
  #   volumes:
  #     - ${IMAGE_MODELS_PATH:-${MODELS_PATH:-/srv/orizon-models}}:${IMAGE_MODELS_SERVE_PATH:-${MODELS_SERVE_PATH:-/home/vllm/models}}:ro
  #     - orizon_vllm_cache:/home/vllm/.cache
  #   networks:
  #     - orizon-network
  #   depends_on:
  #     vllm-server:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:${IMAGE_VLLM_PORT:-8003}/health"]
  #     interval: ${HEALTHCHECK_INTERVAL:-30s}
  #     timeout: ${HEALTHCHECK_TIMEOUT:-30s}
  #     start_period: ${HEALTHCHECK_START_PERIOD:-5s}
  #     retries: ${HEALTHCHECK_RETRIES:-3}
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 16G
  #       reservations:
  #         memory: 8G
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["${IMAGE_VLLM_GPU_DEVICE:-${BACKEND_GPU_DEVICE:-0}}"]
  #             capabilities: [gpu]

  rerank-vllm-server:
    logging: *default-logging
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-ai-rerank-vllm:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: ./backend-orizon-ai/Dockerfile.vllm.rerank
    container_name: orizon-rerank-vllm
    ports:
      - "${RERANK_VLLM_PORT:-8004}:${RERANK_VLLM_PORT:-8004}"
    env_file:
      - .env.vllm
    environment:
      - RERANK_VLLM_PORT=${RERANK_VLLM_PORT:-8004}
    volumes:
      - ${RERANK_MODELS_PATH:-${MODELS_PATH:-/srv/orizon-models}}:${RERANK_MODELS_SERVE_PATH:-${MODELS_SERVE_PATH:-/home/vllm/models}}:ro
      - orizon_vllm_cache:/home/vllm/.cache
    networks:
      - orizon-network
    depends_on:
      vllm-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${RERANK_VLLM_PORT:-8004}/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: 300s
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ["${RERANK_VLLM_GPU_DEVICE:-${BACKEND_GPU_DEVICE:-0}}"]
              capabilities: [gpu]

  embedding-vllm-server:
    logging: *default-logging
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-ai-embedding-vllm:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: ./backend-orizon-ai/Dockerfile.vllm.embedding
    container_name: orizon-embedding-vllm
    ports:
      - "${EMBEDDING_VLLM_PORT:-8006}:${EMBEDDING_VLLM_PORT:-8006}"
    env_file:
      - .env.vllm
    environment:
      - EMBEDDING_VLLM_PORT=${EMBEDDING_VLLM_PORT:-8006}
    volumes:
      - ${EMBEDDING_MODELS_PATH:-${MODELS_PATH:-/srv/orizon-models}}:${EMBEDDING_MODELS_SERVE_PATH:-${MODELS_SERVE_PATH:-/home/vllm/models}}:ro
      - orizon_vllm_cache:/home/vllm/.cache
    networks:
      - orizon-network
    depends_on:
      vllm-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${EMBEDDING_VLLM_PORT:-8006}/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: 300s
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              device_ids: ["${EMBEDDING_VLLM_GPU_DEVICE:-${BACKEND_GPU_DEVICE:-0}}"]
              capabilities: [gpu]

  transcription-vllm-server:
    logging: *default-logging
    profiles: ["transcription"]
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/transcription-bot-vllm:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: ./transcription-bot-orizon-ai/Dockerfile.vllm
    container_name: orizon-transcription-vllm
    ports:
      - "${TRANSCRIPTION_VLLM_PORT:-8002}:${TRANSCRIPTION_VLLM_PORT:-8002}"
    env_file:
      - .env.vllm
    environment:
      - TRANSCRIPTION_VLLM_PORT=${TRANSCRIPTION_VLLM_PORT:-8002}
      # Model is present locally; never reach out to HuggingFace (host has no HF TLS trust)
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ${TRANSCRIPTION_MODELS_PATH:-${MODELS_PATH:-/srv/orizon-models}}:${TRANSCRIPTION_MODELS_SERVE_PATH:-${MODELS_SERVE_PATH:-/home/vllm/models}}:rw
      - ./transcription-bot-orizon-ai/data:/app/data:rw
    networks:
      - orizon-network
    depends_on:
      vllm-server:
        condition: service_healthy
      # image-vllm-server:
      #   condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TRANSCRIPTION_VLLM_PORT:-8002}/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: 300s
      retries: ${HEALTHCHECK_RETRIES:-5}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TRANSCRIPTION_BOT_GPU_DEVICE:-0}"]
              capabilities: [gpu]

  diarization-server:
    logging: *default-logging
    profiles: ["transcription"]
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/diarization-server:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: ./transcription-bot-orizon-ai/Dockerfile.diarization
    container_name: orizon-diarization-server
    ports:
      - "${DIARIZATION_SERVER_PORT:-8008}:${DIARIZATION_SERVER_PORT:-8008}"
    env_file:
      - .env.vllm
      - path: .env.secrets
        required: false
    environment:
      - DIARIZATION_SERVER_PORT=${DIARIZATION_SERVER_PORT:-8008}
      - HF_HUB_OFFLINE=1
      - HF_HOME=${TRANSCRIPTION_MODELS_SERVE_PATH:-${MODELS_SERVE_PATH:-/home/vllm/models}}
    volumes:
      - ${TRANSCRIPTION_MODELS_PATH:-${MODELS_PATH:-/srv/orizon-models}}:${TRANSCRIPTION_MODELS_SERVE_PATH:-${MODELS_SERVE_PATH:-/home/vllm/models}}:rw
    networks:
      - orizon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${DIARIZATION_SERVER_PORT:-8008}/health')"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: 300s
      retries: ${HEALTHCHECK_RETRIES:-5}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DIARIZATION_GPU_DEVICE:-0}"]
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  backend:
    logging: *default-logging
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-ai-backend:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: ./backend-orizon-ai/Dockerfile
    container_name: orizon-backend
    ports:
      # The backend enforces no authorization of its own (docs/SECURITY_NOTES.md §1),
      # so publish it on loopback and nothing else: reachable from this host, and not
      # from another machine. Everything in the stack talks to it over orizon-network
      # at http://backend:${SERVER_PORT} instead, which this does not touch.
      - "${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-8005}:${SERVER_PORT:-8005}"
    # Credentials are a SEPARATE file, mounted only into the three services that
    # actually authenticate with something. Every other container in this stack
    # gets .env alone and therefore holds no key at all: a shell in the reranker
    # or an MCP connector no longer reads the Telegram token or the Google key.
    # `required: false` keeps a deployment that has not created the file working,
    # with those credentials simply unset.
    env_file:
      - .env
      - path: .env.secrets
        required: false
    environment:
      SSL_CERT_DIR: /etc/ssl/certs
    volumes:
      - ./backend-orizon-ai/data:/app/data
      - ./backend-orizon-ai/logs:/app/logs
      # The live Prisma schema and generated client are DEV mounts, in
      # docker-compose.dev.yml: a pulled image already carries both, and an
      # empty host directory mounted over them breaks the client.
      # FUSE mount point for SMB sources (LDAP_GROUPS ACL mode). 'shared'
      # propagation is what lets the host see the mounts; Docker Desktop on
      # macOS cannot do it, so local dev sets ORIZON_SMB_MOUNT_PROPAGATION=rw.
      - ${ORIZON_SMB_MOUNT_BASE_DIR:-/mnt/orizon}:${ORIZON_SMB_MOUNT_BASE_DIR:-/mnt/orizon}:${ORIZON_SMB_MOUNT_PROPAGATION:-shared}
      - orizon_doc_assets:/doc-assets
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    networks:
      - orizon-network
    depends_on:
      frontend:
        condition: service_started
      vllm-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-64G}
          cpus: "${BACKEND_CPU_LIMIT:-16.0}"
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-32G}
          cpus: "${BACKEND_CPU_RESERVATION:-8.0}"

  frontend:
    logging: *default-logging
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-ai-frontend:${ORIZON_VERSION:-v1.0.0}
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    build:
      context: .
      dockerfile: ./frontend-orizon-ai/Dockerfile.prod
      # The Entra application is not a build arg. It is configured at Settings >
      # System and fetched at startup by src/instrumentation.ts, so the image is
      # built without it and changing it needs no rebuild.
      args:
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
        SECURE_COOKIES: ${SECURE_COOKIES}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME}
    container_name: orizon-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
      - path: .env.secrets
        required: false
    networks:
      - orizon-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      # backend:
      #   condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  transcription-bot:
    logging: *default-logging
    profiles: ["transcription"]
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/transcription-bot:${ORIZON_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: ./transcription-bot-orizon-ai/Dockerfile.backend
    container_name: orizon-transcription-bot
    expose:
      - "${TRANSCRIPTION_SERVICE_PORT:-8007}"
    env_file:
      - .env
      - path: .env.secrets
        required: false
    volumes:
      - ./transcription-bot-orizon-ai/data:/app/data
      - ./transcription-bot-orizon-ai/logs:/app/logs
    networks:
      - orizon-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      transcription-vllm-server:
        condition: service_healthy
      diarization-server:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TRANSCRIPTION_SERVICE_PORT:-8007}/health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-30s}
      start_period: ${HEALTHCHECK_START_PERIOD:-30s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Nginx reverse proxy
  # Active template is controlled by NGINX_TEMPLATE in .env (a bind mount path,
  # so Compose must read it there); everything else nginx and certbot need is in
  # .env.nginx:
  #   HTTP (localhost, LAN IP, TLS done by a proxy/WAF): orizonai-http-only.conf.template
  #   HTTPS, Let's Encrypt:                              orizonai.conf.template
  #   HTTPS, certificate you provide (SSL_CERT_DIR):     orizonai-custom-cert.conf.template
  # NGINX_DOMAIN and SERVER_PORT are substituted by the nginx image at startup;
  # the routes all three share are in nginx/orizon/.
  # ---------------------------------------------------------------------------
  nginx:
    logging: *default-logging
    image: nginx:alpine
    container_name: orizon-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    env_file:
      - .env.nginx
    environment:
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./nginx/${NGINX_TEMPLATE:-orizonai-http-only.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/orizon:/etc/nginx/orizon:ro
      - letsencrypt:/etc/letsencrypt:ro
      - ${SSL_CERT_DIR:-./certs}:/etc/ssl/custom:ro
    networks:
      - orizon-network
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-10s}
      start_period: ${HEALTHCHECK_START_PERIOD:-5s}
      retries: ${HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

  # ---------------------------------------------------------------------------
  # Certbot — automatic certificate renewal (DNS-01 via Cloudflare)
  # Server does NOT need to be reachable from the internet.
  # Requires NGINX_DOMAIN, CERTBOT_EMAIL, CLOUDFLARE_API_TOKEN set in .env.nginx.
  # On first run, obtains the certificate automatically if none exists.
  # ---------------------------------------------------------------------------
  certbot:
    logging: *default-logging
    image: ${ORIZON_IMAGE_PREFIX:-scr.syneto.eu/orizon-ai/orizon-ai}/orizon-certbot:${ORIZON_VERSION:-v1.0.0}
    build:
      context: ./certbot
      dockerfile: Dockerfile
    container_name: orizon-certbot
    env_file:
      - .env.nginx
    volumes:
      # Shared letsencrypt volume with nginx
      - letsencrypt:/etc/letsencrypt
      # Docker socket so the container can reload nginx after renewal
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - orizon-network
    depends_on:
      - nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 64M
          cpus: "0.1"

networks:
  orizon-network:
    driver: bridge
    name: orizon-network

volumes:
  orizon_postgres_data:
  orizon_vllm_cache:
  letsencrypt:
  orizon_doc_assets:
